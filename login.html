<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>施工図CDE - ログイン</title>
<script src="./config.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1a1c20; color: #e6e6e6;
    display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card { background: #24272e; border: 1px solid #3a3f4b; border-radius: 12px; width: 360px; padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  h1 { font-size: 20px; margin: 0 0 4px; } h1 b { color: #6fd08c; }
  .sub { color: #9aa; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: #cdd3dc; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #1a1c20; color: #e6e6e6; font-size: 14px; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #555; background: #3a3f4b; color: #e6e6e6; cursor: pointer; font-size: 14px; }
  button.primary { background: #0a5; border-color: #0a5; color: #fff; }
  button:hover { filter: brightness(1.1); }
  .note { margin-top: 18px; font-size: 12px; color: #d98a2b; }
  .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  .msg.err { color: #e0483d; } .msg.ok { color: #6fd08c; }
</style>
</head>
<body>
  <div class="card">
    <h1><b>施工図CDE</b></h1>
    <div class="sub">施工図を中心に、設計図・製作図をまとめて突合する共通データ環境</div>
    <label>メールアドレス</label>
    <input id="email" type="email" placeholder="you@example.com" />
    <label>パスワード</label>
    <input id="pw" type="password" placeholder="••••••••" />
    <div class="row">
      <button class="primary" id="signin">ログイン</button>
      <button id="signup">新規登録</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="note" id="note"></div>
  </div>

<script type="module">
import { auth, db } from "./db.js";
const msg = document.getElementById("msg"), note = document.getElementById("note");
const show = (t, cls) => { msg.textContent = t; msg.className = "msg " + (cls || ""); };

if (!db.enabled) {
  note.innerHTML = "⚠ Supabase未設定（config.js）。今は<b>デモモード</b>で認証なしでも進めます。";
  const b = document.createElement("button");
  b.textContent = "デモとして図面一覧へ →"; b.className = "primary"; b.style.marginTop = "14px"; b.style.width = "100%";
  b.onclick = () => (location.href = "./home.html");
  document.querySelector(".card").appendChild(b);
} else {
  // 既にログイン済みなら飛ばす
  auth.user().then((u) => { if (u) location.href = "./home.html"; });
}

document.getElementById("signin").onclick = async () => {
  show("ログイン中…");
  const { error } = await auth.signIn(email.value.trim(), pw.value);
  if (error) return show(error.message, "err");
  location.href = "./home.html";
};
document.getElementById("signup").onclick = async () => {
  show("登録中…");
  const { error } = await auth.signUp(email.value.trim(), pw.value);
  if (error) return show(error.message, "err");
  show("確認メールを送りました。認証後にログインしてください。", "ok");
};
</script>
</body>
</html>
