<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>施工図CDE - 突合ビュー</title>
<script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.0/build/openseadragon/openseadragon.min.js"></script>
<script src="./config.js"></script>
<style>
  :root {
    --bg: #0f1319; --surface: #161b22; --surface-2: #1d232c; --raised: #232a34;
    --line: #29313c; --line-soft: #212832;
    --ink: #e9edf2; --muted: #8b96a5; --faint: #6b7482;
    --accent: #46b3a1; --accent-ink: #0c1512;
    --sekou: #e0483d; --sekkei: #3a86ff;
    --amber: #d9a441; --green: #43a86a;
    --sans: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, "Roboto Mono", monospace;
    --r: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--ink); font-size: 14px; }

  /* ---- Header ---- */
  header { height: 52px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; }
  .back { color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; transition: color .15s; }
  .back:hover { color: var(--ink); }
  .dno { font-family: var(--mono); font-weight: 600; font-size: 15px; letter-spacing: .04em; color: var(--ink); }
  .dtitle { color: var(--muted); font-size: 13px; }
  .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; padding: 3px 8px; border-radius: 5px; background: rgba(224,72,61,.14); color: #f0857c; border: 1px solid rgba(224,72,61,.3); }
  .versel { font-family: var(--mono); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  .grow { flex: 1; }
  .statusmsg { color: var(--faint); font-size: 12px; font-family: var(--mono); }
  .oldnote { color: var(--amber); font-size: 12px; }
  .badge { font-family: var(--mono); padding: 3px 9px; border-radius: 20px; font-size: 11px; letter-spacing: .03em; border: 1px solid transparent; }
  .badge.v0 { background: rgba(139,150,165,.15); color: #aab3c0; border-color: rgba(139,150,165,.3); }
  .badge.v1 { background: rgba(217,164,65,.15); color: var(--amber); border-color: rgba(217,164,65,.35); }
  .badge.v2 { background: rgba(67,168,106,.16); color: #6fce93; border-color: rgba(67,168,106,.4); }

  /* ---- Stage ---- */
  #stage { display: flex; height: calc(100vh - 52px - 60px); }
  #viewer { flex: 1; position: relative; background:
    repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,255,255,.02) 23px 24px),
    repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,.02) 23px 24px), #0c0f14; }
  #panel { width: 300px; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  .panel-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .panel-title { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .counts { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 6px; }
  #mklist { overflow-y: auto; flex: 1; }
  .mkrow { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); font-size: 13px; cursor: pointer; transition: background .12s; }
  .mkrow:hover { background: var(--surface-2); }
  .mkrow .top { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; }
  .mkrow .body { color: #c3ccd6; line-height: 1.45; }
  .chip { font-family: var(--mono); font-size: 10px; letter-spacing: .03em; padding: 2px 8px; border-radius: 20px; color: #fff; cursor: pointer; user-select: none; }
  .chip.s0 { background: var(--sekou); } .chip.s1 { background: var(--amber); } .chip.s2 { background: var(--green); }
  .num { font-family: var(--mono); width: 20px; height: 20px; border-radius: 5px; background: var(--raised); color: var(--ink); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }
  .del { margin-left: auto; color: var(--faint); transition: color .12s; }
  .del:hover { color: var(--sekou); }

  /* ---- Toolbar ---- */
  .bar { height: 60px; padding: 0 16px; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 16px; align-items: center; overflow-x: auto; }
  .grp { display: flex; gap: 10px; align-items: center; }
  .grp-label { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .divider { width: 1px; height: 30px; background: var(--line); flex-shrink: 0; }
  .legend { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .sw-r { background: var(--sekou); } .sw-b { background: var(--sekkei); margin-left: 8px; }
  .chk { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .chk input { accent-color: var(--accent); }
  .rng { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  input[type=range] { width: 130px; accent-color: var(--accent); }

  /* ---- Buttons ---- */
  button { font-family: var(--sans); background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 13px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background .13s, border-color .13s, transform .05s; }
  button:hover { background: var(--raised); border-color: #37414d; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.active { background: rgba(70,179,161,.16); border-color: var(--accent); color: #7fd6c7; }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-accent:hover { background: #53c1ae; border-color: #53c1ae; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn-sm { padding: 5px 11px; font-size: 12px; }
  .seg { display: inline-flex; }
  .seg .btn-icon { border-radius: 0; padding: 7px 11px; font-family: var(--mono); }
  .seg .btn-icon:first-child { border-radius: 7px 0 0 7px; }
  .seg .btn-icon:last-child { border-radius: 0 7px 7px 0; border-left: none; }

  /* ---- Overlays / markers ---- */
  #hint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(70,179,161,.95); color: var(--accent-ink); padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; display: none; z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .mk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .mk.base { background: var(--sekou); } .mk.ov { background: var(--sekkei); }
  .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.5); cursor: pointer; }
  .pin span { transform: rotate(45deg); display: block; text-align: center; line-height: 22px; color: #fff; font-size: 12px; font-weight: bold; }
  .pin.s0 { background: var(--sekou); } .pin.s1 { background: var(--amber); } .pin.s2 { background: var(--green); }

  /* ---- Approval modal ---- */
  #modal { position: fixed; inset: 0; background: rgba(6,9,13,.66); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 100; }
  #modal.open { display: flex; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 460px; max-width: 92vw; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .card .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .rolepick { display: flex; gap: 8px; margin-bottom: 18px; }
  .rolepick button { flex: 1; }
  .step { display: flex; gap: 12px; align-items: flex-start; padding: 13px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px; }
  .step.cur { border-color: var(--accent); background: rgba(70,179,161,.07); }
  .step .dot { font-family: var(--mono); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; background: var(--raised); color: var(--ink); flex-shrink: 0; }
  .step.ok .dot { background: var(--green); } .step.ng .dot { background: var(--sekou); }
  .step .role { font-size: 14px; } .step .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .step .acts { margin-left: auto; display: flex; gap: 6px; }
  .modal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .ok-banner { background: rgba(67,168,106,.12); border: 1px solid rgba(67,168,106,.4); color: #7fd6a0; padding: 11px; border-radius: 9px; text-align: center; margin-top: 10px; }
  .btn-primary { background: var(--green); border-color: var(--green); color: #06210f; font-weight: 600; }
  .btn-danger { background: rgba(224,72,61,.16); border-color: rgba(224,72,61,.5); color: #f0857c; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header>
    <a class="back" href="home.html">← 図面一覧</a>
    <span class="divider"></span>
    <span class="dno" id="dno">A-101</span>
    <span class="dtitle" id="dtitle">1F平面詳細図</span>
    <span class="tag" id="dtype">施工図</span>
    <select id="versel" class="versel" title="版を切替"></select>
    <span id="vstatus" class="badge v0">作業中</span>
    <span id="oldnote" class="oldnote" style="display:none;">旧版・閲覧のみ</span>
    <span class="grow"></span>
    <span id="status" class="statusmsg"></span>
    <button id="approve" class="btn-accent">承認フロー</button>
  </header>
  <div id="stage">
    <div id="viewer"><div id="hint"></div></div>
    <div id="panel">
      <div class="panel-head">
        <div><span class="panel-title">赤入れ</span><span id="counts" class="counts"></span></div>
        <button id="markup" class="btn-sm">＋ ピン追加</button>
      </div>
      <div id="mklist"></div>
    </div>
  </div>
  <div class="bar">
    <div class="grp">
      <span class="grp-label">重ね合わせ</span>
      <span class="legend"><span class="sw sw-r"></span>施工図<span class="sw sw-b"></span>設計図</span>
      <label class="chk"><input id="toggle" type="checkbox" checked /> 重ねる</label>
      <label class="rng">透明度 <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.5" /><span id="opv">50%</span></label>
    </div>
    <span class="divider"></span>
    <div class="grp">
      <span class="grp-label">位置合わせ</span>
      <button id="autoAlign" class="btn-accent">✨ 自動合わせ</button>
      <button id="adjust">🔧 微調整</button>
      <span class="seg"><button id="scaleDown" class="btn-icon" title="設計図を縮小">－</button><button id="scaleUp" class="btn-icon" title="設計図を拡大">＋</button></span>
      <button id="align">2点合わせ</button>
      <button id="reset" class="btn-ghost">リセット</button>
    </div>
  </div>

  <div id="modal">
    <div class="card">
      <h2>承認フロー</h2>
      <div class="sub" id="apprSub"></div>
      <div style="font-size:13px;color:#9aa;margin-bottom:6px;">あなたの役割（PoC切替）</div>
      <div class="rolepick" id="rolepick"></div>
      <div id="steps"></div>
      <div id="okBanner"></div>
      <div class="modal-foot">
        <button id="resubmit">↺ 再申請</button>
        <button id="closeModal">閉じる</button>
      </div>
    </div>
  </div>

<script type="module">
import { STATUS, ROLES, resolveDrawing, listVersions, markups as MK, align as AL, approval as AP } from "./data.js";

const $ = (id) => document.getElementById(id);
const VSTATUS = ["作業中", "社内確認", "提出承認済"];
const escapeHtml = (s) => (s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const SP = new URLSearchParams(location.search);
const PARAM = SP.get("drawing"), REV = SP.get("rev");
const INITIAL_OV = { x: 0.045, y: 0.02, width: 0.9 };   // 設計図の初期ズレ(自動/手動合わせで解消)
let ctx, viewer, baseItem = null, overlayItem = null;
let mks = [], mkMode = false;

async function boot() {
  ctx = await resolveDrawing(PARAM, REV);
  $("dno").textContent = ctx.no;
  $("dtitle").textContent = ctx.title;
  $("status").textContent = ctx.overlay ? "根拠図面: " + ctx.overlay.label : "根拠図面なし";
  const v0 = Math.max(0, VSTATUS.indexOf(ctx.status));  // 版ステータスをバッジに反映
  $("vstatus").className = "badge v" + v0; $("vstatus").textContent = VSTATUS[v0] || ctx.status;
  $("oldnote").style.display = ctx.isOld ? "inline" : "none";
  await populateVersions();

  viewer = OpenSeadragon({
    id: "viewer",
    prefixUrl: "https://cdn.jsdelivr.net/npm/openseadragon@4.1.0/build/openseadragon/images/",
    tileSources: ctx.baseTile || [],
    showNavigator: true, navigatorPosition: "TOP_RIGHT",
    gestureSettingsMouse: { clickToZoom: false },
  });
  wireControls();

  if (!ctx.baseTile) {
    const ph = $("hint");
    ph.style.display = "block"; ph.style.top = "50%"; ph.style.background = "rgba(60,60,70,.95)";
    ph.textContent = `「${ctx.no} ${ctx.title}」はタイル未生成です（PoCでは A-101 と設計図のみ生成済み）`;
    return;
  }
  viewer.addHandler("open", async () => {
    baseItem = viewer.world.getItemAt(0);
    if (ctx.overlay?.tile) {
      viewer.addTiledImage({
        tileSource: ctx.overlay.tile, opacity: 0.5,
        x: INITIAL_OV.x, y: INITIAL_OV.y, width: INITIAL_OV.width,
        success: async (e) => { overlayItem = e.item; await applySavedAlign(); },
      });
    }
    mks = await MK.list(ctx); renderPins(); renderList();
    viewer.addHandler("animation", renderPins);
  });
}

/* ===== 版切替 ===== */
async function populateVersions() {
  const vers = await listVersions(ctx.no);
  const sel = $("versel");
  sel.replaceChildren();
  vers.forEach((v) => {
    const o = document.createElement("option");
    o.value = v.rev;                                   // textContent/valueで注入=XSS不可
    o.textContent = v.rev + (v.current ? "（現行）" : "（旧版）");
    if (v.rev === ctx.rev) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { location.href = `index.html?drawing=${encodeURIComponent(ctx.no)}&rev=${encodeURIComponent(sel.value)}`; };
}

/* ===== コントロール ===== */
function wireControls() {
  const op = $("opacity"), toggle = $("toggle");
  op.addEventListener("input", () => {
    $("opv").textContent = Math.round(op.value * 100) + "%";
    if (overlayItem && toggle.checked) overlayItem.setOpacity(Number(op.value));
  });
  toggle.addEventListener("change", () => { if (overlayItem) overlayItem.setOpacity(toggle.checked ? Number(op.value) : 0); });

  $("markup").addEventListener("click", () => {
    mkMode = !mkMode; $("markup").classList.toggle("active", mkMode);
    showHint(mkMode ? "図面をクリックして赤入れを追加" : ""); if (!mkMode) hideHint();
  });
  $("align").addEventListener("click", () => (alignMode ? endAlign() : startAlign()));
  $("reset").addEventListener("click", resetAlign);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && alignMode) { clearMarkers(); endAlign(); } });

  // ---- 微調整: ドラッグで移動 / ＋－で拡大縮小 / 矢印キー ----
  $("adjust").addEventListener("click", () => {
    adjustMode = !adjustMode;
    $("adjust").classList.toggle("active", adjustMode);
    if (adjustMode) {
      if (mkMode) $("markup").click();
      if (alignMode) { clearMarkers(); endAlign(); }
      op.value = 0.6; op.dispatchEvent(new Event("input"));
      showHint("設計図(青)をドラッグで移動 ／ ＋－で拡大縮小 ／ 矢印キーで微調整");
    } else hideHint();
  });
  $("autoAlign").addEventListener("click", autoAlign);
  $("scaleUp").addEventListener("click", () => scaleOverlay(1.02));
  $("scaleDown").addEventListener("click", () => scaleOverlay(1 / 1.02));
  viewer.addHandler("canvas-drag", (e) => {
    if (!adjustMode || !overlayItem) return;
    e.preventDefaultAction = true;
    const d = viewer.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(e.delta.x, e.delta.y));
    const b = overlayItem.getBounds();
    overlayItem.setPosition(new OpenSeadragon.Point(b.x + d.x, b.y + d.y), true);
  });
  viewer.addHandler("canvas-drag-end", () => { if (adjustMode && overlayItem) saveOverlay(); });
  document.addEventListener("keydown", (e) => {
    if (!adjustMode || !overlayItem) return;
    const step = 0.004; let dx = 0, dy = 0;
    if (e.key === "ArrowLeft") dx = -step; else if (e.key === "ArrowRight") dx = step;
    else if (e.key === "ArrowUp") dy = -step; else if (e.key === "ArrowDown") dy = step; else return;
    e.preventDefault();
    const b = overlayItem.getBounds();
    overlayItem.setPosition(new OpenSeadragon.Point(b.x + dx, b.y + dy), true); saveOverlay();
  });

  $("approve").addEventListener("click", openApproval);
  $("closeModal").addEventListener("click", () => $("modal").classList.remove("open"));
  $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) $("modal").classList.remove("open"); });
  $("resubmit").addEventListener("click", async () => { appr = await AP.resubmit(ctx, appr); renderApproval(); });

  viewer.addHandler("canvas-click", onCanvasClick);
}

/* ===== 赤入れ ===== */
async function addMarkupAt(x, y) {
  const body = prompt("赤入れコメント（例: 配管が梁に干渉）", "");
  if (body === null) return;
  mks = await MK.add(ctx, x, y, body); renderPins(); renderList();
}
let pinEls = [];
function renderPins() {
  if (!baseItem) return;
  pinEls.forEach((el) => viewer.removeOverlay(el)); pinEls = [];
  mks.forEach((m, i) => {
    const vp = baseItem.imageToViewportCoordinates(m.x, m.y);
    const el = document.createElement("div");
    el.className = "pin s" + m.status; el.innerHTML = `<span>${i + 1}</span>`;
    el.title = STATUS[m.status] + ": " + (m.body || "(空)");
    el.addEventListener("click", (ev) => { ev.stopPropagation(); focusMarkup(m.id); });
    viewer.addOverlay({ element: el, location: vp, placement: "BOTTOM" }); pinEls.push(el);
  });
}
function renderList() {
  const list = $("mklist"); list.innerHTML = "";
  mks.forEach((m, i) => {
    const row = document.createElement("div"); row.className = "mkrow";
    row.innerHTML =
      `<div class="top"><span class="num">${i + 1}</span>
         <span class="chip s${m.status}" data-act="status">${STATUS[m.status]}</span>
         <span class="del" data-act="del">✕</span></div>
       <div class="body">${escapeHtml(m.body) || "<i style='color:#777'>(コメントなし)</i>"}</div>`;
    row.addEventListener("click", async (e) => {
      const act = e.target.getAttribute("data-act");
      if (act === "status") { mks = await MK.update(ctx, m.id, { status: (m.status + 1) % 3 }); renderPins(); renderList(); }
      else if (act === "del") { mks = await MK.remove(ctx, m.id); renderPins(); renderList(); }
      else focusMarkup(m.id);
    });
    list.appendChild(row);
  });
  const c = [0, 1, 2].map((s) => mks.filter((m) => m.status === s).length);
  $("counts").textContent = `未対応${c[0]} / 対応中${c[1]} / 解決${c[2]}`;
}
function focusMarkup(id) {
  const m = mks.find((x) => x.id === id); if (!m || !baseItem) return;
  viewer.viewport.panTo(baseItem.imageToViewportCoordinates(m.x, m.y), false);
}

/* ===== 2点位置合わせ ===== */
let alignMode = false, adjustMode = false, clicks = [], markers = [];
function scaleOverlay(f) {
  if (!overlayItem) return;
  const b = overlayItem.getBounds();
  const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
  overlayItem.setWidth(b.width * f, true);
  const nb = overlayItem.getBounds();
  overlayItem.setPosition(new OpenSeadragon.Point(cx - nb.width / 2, cy - nb.height / 2), true);
  saveOverlay();
}
function saveOverlay() {
  const b = overlayItem.getBounds();
  AL.save(ctx, { x: b.x, y: b.y, width: b.width, scale: b.width });
  $("status").textContent = `位置調整済 (scale=${b.width.toFixed(3)})`;
}
const STEPS = [
  "① 施工図(下)の特徴点をクリック 〔赤〕",
  "② ①と同じ場所を 設計図 上でクリック 〔青〕",
  "③ 施工図(下)の別の特徴点をクリック 〔赤〕",
  "④ ③と同じ場所を 設計図 上でクリック 〔青〕",
];
function startAlign() {
  if (!overlayItem) return;
  if (mkMode) $("markup").click();
  alignMode = true; clicks = []; clearMarkers();
  $("align").classList.add("active"); $("align").textContent = "位置合わせ中… (Esc中止)";
  const op = $("opacity"); op.value = 0.55; op.dispatchEvent(new Event("input")); showHint(STEPS[0]);
}
function endAlign() { alignMode = false; $("align").classList.remove("active"); $("align").textContent = "🎯 位置合わせ"; hideHint(); }
const hint = () => $("hint");
function showHint(t) { hint().textContent = t; hint().style.display = t ? "block" : "none"; }
function hideHint() { hint().style.display = "none"; }

function onCanvasClick(e) {
  const vp = viewer.viewport.pointFromPixel(e.position);
  if (alignMode) {
    e.preventDefaultAction = true;
    const isBase = clicks.length % 2 === 0;
    clicks.push({ x: vp.x, y: vp.y });
    addMarker(vp, isBase ? "base" : "ov", Math.floor(clicks.length / 2) + 1);
    if (clicks.length < 4) { showHint(STEPS[clicks.length]); return; }
    computeAndApply(); endAlign();
  } else if (mkMode) {
    if (!baseItem) return;
    e.preventDefaultAction = true;
    const img = baseItem.viewportToImageCoordinates(vp);
    addMarkupAt(img.x, img.y);
  }
}
async function computeAndApply() {
  const [P1, Q1, P2, Q2] = clicks;
  const dP = Math.hypot(P2.x - P1.x, P2.y - P1.y), dQ = Math.hypot(Q2.x - Q1.x, Q2.y - Q1.y);
  const s = dQ > 1e-9 ? dP / dQ : 1;
  const b = overlayItem.getBounds();
  const nx = P1.x + s * (b.x - Q1.x), ny = P1.y + s * (b.y - Q1.y), nw = s * b.width;
  overlayItem.setPosition(new OpenSeadragon.Point(nx, ny), true); overlayItem.setWidth(nw, true);
  await AL.save(ctx, { x: nx, y: ny, width: nw, scale: s });
  $("status").textContent = `位置合わせ済 (scale=${s.toFixed(3)})`;
  setTimeout(clearMarkers, 1200);
}
async function applySavedAlign() {
  const t = await AL.get(ctx); if (!t) return;
  overlayItem.setPosition(new OpenSeadragon.Point(t.x, t.y), true); overlayItem.setWidth(t.width, true);
  $("status").textContent = `位置合わせ復元済 (scale=${(t.scale || 1).toFixed(3)})`;
}
async function resetAlign() {
  await AL.reset(ctx);
  if (overlayItem) { overlayItem.setPosition(new OpenSeadragon.Point(INITIAL_OV.x, INITIAL_OV.y), true); overlayItem.setWidth(INITIAL_OV.width, true); }
  clearMarkers(); $("status").textContent = "ズレた状態に戻しました";
}

/* ===== 自動合わせ（画像解析で設計図の輪郭を施工図にフィット） ===== */
async function autoAlign() {
  if (!overlayItem || !ctx.overlay?.tile) return;
  showHint("自動解析中…");
  try {
    const bI = ctx.baseTile.Image, oI = ctx.overlay.tile.Image;
    const lv = (im) => Math.max(0, Math.ceil(Math.log2(Math.max(im.Size.Width, im.Size.Height))) - 4); // 全体が1タイルに収まるレベル
    const [bb, ob] = await Promise.all([
      contentBBox(`${bI.Url}${lv(bI)}/0_0.${bI.Format}`),
      contentBBox(`${oI.Url}${lv(oI)}/0_0.${oI.Format}`),
    ]);
    if (!bb || !ob) { showHint("自動解析に失敗（手動でどうぞ）"); setTimeout(hideHint, 1500); return; }
    const baseH = baseItem.getBounds().height;
    const Wd = (bb.x1 - bb.x0) / (ob.x1 - ob.x0);          // 輪郭幅比＝拡大率
    const X = bb.x0 - ob.x0 * Wd;
    const Y = baseH * (bb.y0 - ob.y0 * Wd);
    overlayItem.setWidth(Wd, true);
    overlayItem.setPosition(new OpenSeadragon.Point(X, Y), true);
    saveOverlay();
    $("status").textContent = "✨ 自動で位置合わせしました";
    hideHint();
  } catch (e) { showHint("自動解析に失敗: " + e.message); setTimeout(hideHint, 1500); }
}
// 画像の「濃い画素」の外接矩形を正規化[0,1]で返す
function contentBBox(url) {
  return new Promise((res) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
      const g = c.getContext("2d"); g.drawImage(img, 0, 0);
      let d; try { d = g.getImageData(0, 0, c.width, c.height).data; } catch { return res(null); }
      let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0, found = false;
      for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
        const i = (y * c.width + x) * 4, lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        if (d[i + 3] > 10 && lum < 210) { found = true; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      res(found ? { x0: x0 / c.width, y0: y0 / c.height, x1: x1 / c.width, y1: y1 / c.height } : null);
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}
function addMarker(vp, kind, num) {
  const el = document.createElement("div"); el.className = "mk " + kind; el.textContent = num;
  viewer.addOverlay({ element: el, location: vp, placement: "CENTER" }); markers.push(el);
}
function clearMarkers() { markers.forEach((m) => viewer.removeOverlay(m)); markers = []; }

/* ===== 多段承認 ===== */
let myRole = "施工図担当", appr = null;
function currentStepIndex() {
  for (let i = 0; i < appr.steps.length; i++) { if (appr.steps[i].decision === "承認") continue; return i; }
  return -1;
}
function versionStatus() {
  if (appr.state === "承認済") return 2;
  return appr.steps.some((s) => s.decision) ? 1 : 0;
}
function updateBadge() {
  const v = versionStatus(), b = $("vstatus"); b.className = "badge v" + v; b.textContent = VSTATUS[v];
}
async function openApproval() {
  appr = await AP.get(ctx);
  $("apprSub").textContent = `${ctx.no} ${ctx.title} / ${ctx.rev}　${ROLES.join(" → ")}`;
  renderApproval(); $("modal").classList.add("open");
}
function renderApproval() {
  const rp = $("rolepick"); rp.innerHTML = "";
  ROLES.forEach((r) => {
    const b = document.createElement("button"); b.textContent = r;
    if (r === myRole) b.classList.add("active");
    b.onclick = () => { myRole = r; renderApproval(); }; rp.appendChild(b);
  });
  const cur = currentStepIndex(), host = $("steps"); host.innerHTML = "";
  appr.steps.forEach((s, i) => {
    const div = document.createElement("div"); div.className = "step";
    let icon = s.seq;
    if (s.decision === "承認") { div.classList.add("ok"); icon = "✓"; }
    else if (s.decision === "差戻し") { div.classList.add("ng"); icon = "✕"; }
    if (i === cur && appr.state !== "承認済") div.classList.add("cur");
    div.innerHTML =
      `<div class="dot">${icon}</div>
       <div><div class="role">${s.role}</div>
       <div class="meta">${s.decision ? s.decision + (s.comment ? "：" + escapeHtml(s.comment) : "") : (i === cur ? "承認待ち" : "—")}</div></div>
       <div class="acts"></div>`;
    if (i === cur && appr.state !== "承認済" && s.role === myRole) {
      const ok = document.createElement("button"); ok.className = "btn-primary"; ok.textContent = "承認";
      ok.onclick = () => decide(s, "承認");
      const ng = document.createElement("button"); ng.className = "btn-danger"; ng.textContent = "差戻し";
      ng.onclick = () => decide(s, "差戻し");
      div.querySelector(".acts").append(ok, ng);
    }
    host.appendChild(div);
  });
  const banner = $("okBanner"), cur2 = currentStepIndex();
  banner.innerHTML = appr.state === "承認済"
    ? `<div class="ok-banner">✔ 全承認完了 — この版は「提出承認済(Published)」になりました</div>`
    : (cur2 >= 0 && appr.steps[cur2].role !== myRole && appr.state !== "差戻し"
        ? `<div class="sub" style="margin-top:8px">いまは <b>${appr.steps[cur2].role}</b> の承認待ち（役割を切替えて操作を試せます）</div>` : "");
  updateBadge();
}
async function decide(step, decision) {
  let comment = "";
  if (decision === "差戻し") { comment = prompt("差戻し理由", ""); if (comment === null) return; }
  appr = await AP.decide(ctx, appr, step.key, decision, comment); renderApproval();
}

boot();
</script>
